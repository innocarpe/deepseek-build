# Vendored Grok workspace tests, after merge only.
#
# This is its own workflow so CI's cancel-in-progress cannot kill it. A later
# push starts that workflow only when these paths change, so a docs merge does
# not cancel a test already running.
#
# A newer grok push queues behind the running run instead of killing it. The
# suite needs ~20 min to compile the workspace plus ~12 min of tests, and vendor
# pushes land every ~20 min on an active day, so `cancel-in-progress: true` left
# every run dead before the test binaries started: measured 2026-09-26, six runs
# in 3.5 h produced no completed verdict at all (4 killed, 2 cancelled). Queuing
# keeps one run in flight and the newest pending one (GitHub's default `queue:
# single` cancels the older *pending* run), so the newest main is still what gets
# tested next — it just gets tested after the running one finishes.
#
# Do not add this check to branch protection. The workflow does not run on
# docs-only PRs, and GitHub treats a required check that never ran as a failure.
name: CI grok test

on:
  push:
    branches: [main]
    paths:
      - "third_party/grok-build/**"
      - "patches/grok-build/**"
      - "scripts/apply-grok-build-patches.sh"
      - "scripts/build-grok-pager.sh"
      - "scripts/test-grok-vendor-offline.sh"
      - "docs/architecture/GROK_VENDOR.md"
      - ".github/workflows/ci-grok-test.yml"
  # Re-validate the current main without a new push (the suite is otherwise only
  # reachable by merging another vendor change).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-grok-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grok_test:
    name: grok test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # SessionActor turn futures can exceed Rust's 2 MiB default test-thread stack.
      # RUST_* is part of the rust-cache key, so this job does not share clippy's cache.
      RUST_MIN_STACK: "16777216"
    defaults:
      run:
        working-directory: third_party/grok-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Install protoc (pinned 29.3 — the repo's dotslash-pinned version)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod 755 /usr/local/bin/protoc
          test -f /usr/local/include/google/protobuf/descriptor.proto
          echo "PROTOC=/usr/local/bin/protoc" >> "$GITHUB_ENV"
          /usr/local/bin/protoc --version
      - name: Install ripgrep (grep tool tests shell out to `rg`)
        run: |
          sudo apt-get install -y -qq ripgrep
          echo "rg: $(command -v rg) $(rg --version | head -n 1)"
      - name: Cache Grok test artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-build-test-v2
          workspaces: third_party/grok-build -> target
          cache-workspace-crates: true
          cache-on-failure: true
          cache-provider: github
          save-if: true
      # Grove identity and redirect-protocol tests are behind the
      # `grove-identities` feature, which this build leaves off (`nfs_off`).
      #
      # `--no-fail-fast`: without it cargo stops at the first failing test
      # target, so one flaky crate hides every crate after it (2026-09-26: a
      # flake in `xai-fast-worktree` hid the whole `xai-grok-pager` suite).
      - name: Test vendored workspace
        run: cargo test --workspace --no-fail-fast
