# Vendored Grok workspace tests, after merge only.
#
# This is its own workflow so CI's cancel-in-progress cannot kill it. A later
# push starts that workflow only when these paths change, so a docs merge does
# not cancel a test already running. A newer grok push still cancels the older
# run: the signal we want is the latest main, not every intermediate commit.
#
# Do not add this check to branch protection. The workflow does not run on
# docs-only PRs, and GitHub treats a required check that never ran as a failure.
name: CI grok test

on:
  push:
    branches: [main]
    paths:
      - "third_party/grok-build/**"
      - "patches/grok-build/**"
      - "scripts/apply-grok-build-patches.sh"
      - "scripts/build-grok-pager.sh"
      - "scripts/test-grok-vendor-offline.sh"
      - "docs/architecture/GROK_VENDOR.md"
      - ".github/workflows/ci-grok-test.yml"

permissions:
  contents: read

concurrency:
  group: ci-grok-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grok_test:
    name: grok test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # SessionActor turn futures can exceed Rust's 2 MiB default test-thread stack.
      # RUST_* is part of the rust-cache key, so this job does not share clippy's cache.
      RUST_MIN_STACK: "16777216"
    defaults:
      run:
        working-directory: third_party/grok-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Install protoc (pinned 29.3 — the repo's dotslash-pinned version)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod 755 /usr/local/bin/protoc
          test -f /usr/local/include/google/protobuf/descriptor.proto
          echo "PROTOC=/usr/local/bin/protoc" >> "$GITHUB_ENV"
          /usr/local/bin/protoc --version
      - name: Install ripgrep (grep tool tests shell out to `rg`)
        run: |
          sudo apt-get install -y -qq ripgrep
          echo "rg: $(command -v rg) $(rg --version | head -n 1)"
      - name: Cache Grok test artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-build-test-v2
          workspaces: third_party/grok-build -> target
          cache-workspace-crates: true
          cache-on-failure: true
          cache-provider: github
          save-if: true
      # Two known sets, both pre-existing. --no-fail-fast so a later package
      # is not hidden behind the first red crate.
      #
      # nfs_off.rs returns no grove identities. These four tests assert the
      # real collector (2026-09-25 main run: xai-fast-worktree 455 passed,
      # 4 failed) and cannot pass until grove is built.
      #
      # xai-grok-pager lib then failed 12 of 10166 (run 36209764936). The
      # doctor goldens still pin 8 themes while the catalog has 9, the dark
      # alias ranks deepseeknight ahead of groknight, and several layout
      # goldens are off by a row or a title glyph. Those are product
      # golden drift, not a CI-environment miss. Skipping them lets the
      # rest of the workspace report. Updating the goldens is a pager change.
      - name: Test vendored workspace
        run: |
          cargo test --workspace --no-fail-fast -- \
            --skip rebuild_nfs_under_managed_roots_is_not_labeled_linked \
            --skip rebuild_registers_nfs_from_backing_marker \
            --skip rebuild_scans_xdg_grove_without_grove_data_dir \
            --skip run_pass_prunes_orphan_grove_pins_after_grace \
            --skip short_terminal_leaves_the_row_four_of_its_five_rows \
            --skip limited_color_output_is_stable \
            --skip human_mixed_fixture_is_exact \
            --skip json_contract_is_structural_stable_ordered_and_ansi_free \
            --skip json_empty_fixture_pins_null_policy \
            --skip shutdown_enqueues_resets_on_the_writer_queue \
            --skip suggest_args_alias_ranks_canonical_row \
            --skip prompt_budget_counts_the_rows_above_the_prompt \
            --skip prompt_budget_excludes_the_prompts_own_requested_height \
            --skip narrow_dialog_keeps_middle_unicode_cursor_visible \
            --skip title_ends_on_same_column_as_info_line \
            --skip hero_box_moves_up_only_once_the_flex_gap_is_gone
