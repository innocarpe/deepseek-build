# CI — parallel path-aware jobs + always-green required check.
# Not process-police. Not one serial mega-job.
#
# Why one workflow with many jobs (not only separate YAML files)?
# GitHub treats *skipped* required checks as failures. Separate path-filtered
# workflows never report when docs-only → branch protection blocks merges.
# A single always-on `required` job aggregates parallel work and stays required.
#
# UI: "CI / fmt", "CI / test", "CI / npm", "CI / grok fmt",
# "CI / grok clippy", "CI / required".
# The vendored workspace test is CI grok test (ci-grok-test.yml), not a job
# here: this workflow's cancel-in-progress would kill it on the next main push.

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — cheap always-on detector
  # ---------------------------------------------------------------------------
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      semver: ${{ steps.filter.outputs.semver }}
      release_verify: ${{ steps.filter.outputs.release_verify }}
      changelog: ${{ steps.filter.outputs.changelog }}
      session_close: ${{ steps.filter.outputs.session_close }}
      vendor_build: ${{ steps.filter.outputs.vendor_build }}
      worktree_ownership: ${{ steps.filter.outputs.worktree_ownership }}
      npm: ${{ steps.filter.outputs.npm }}
      grok: ${{ steps.filter.outputs.grok }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.github/workflows/ci.yml'
            semver:
              - 'Cargo.toml'
              - 'package.json'
              - 'scripts/check-semver.sh'
              - 'npm/scripts/check-version-match.js'
              - '.github/workflows/ci.yml'
            release_verify:
              - 'scripts/verify-npm-version.sh'
              - 'scripts/test-npm-verify-retry.sh'
              - 'scripts/lib/mock_npm_registry.py'
              - 'scripts/release.sh'
              - 'scripts/npm-emergency-publish.sh'
              - '.github/workflows/publish-npm.yml'
              - '.github/workflows/ci.yml'
            # The release move: bump-version.sh opens a version section and
            # must take the Unreleased items with it. Reverting that (or the
            # wiring) fails a required check instead of the next release.
            changelog:
              - 'CHANGELOG.md'
              - 'scripts/bump-version.sh'
              - 'scripts/lib/changelog_release.py'
              - 'scripts/lib/version_log.py'
              - 'scripts/test-changelog-release.sh'
              - 'scripts/reorder-changelog.sh'
              - 'scripts/release.sh'
              - 'docs/contributing/release-cycle.md'
              - 'skills/release/SKILL.md'
              - '.github/workflows/ci.yml'
            # The 2026-09-26 stop: the finish line lived past the skill-description
            # window sessions actually load, and a copied release-lane ban beat
            # the user turn. Reverting that window, or a brief fixture that
            # reproduces the stop, fails here. Not a title or path-inventory lint.
            session_close:
              - 'AGENTS.md'
              - 'skills/session-unit/**'
              - 'skills/release/SKILL.md'
              - 'skills/worktree-dispatch/SKILL.md'
              - 'skills/pr-authoring/SKILL.md'
              - 'docs/contributing/review-checklist.md'
              - 'docs/product/ULTRAGOAL_PROMPT_COLD_START_DEEPSEEK_DEPTH_6X.md'
              - 'scripts/check-session-close.sh'
              - 'scripts/check-pr-merged.sh'
              - 'scripts/lib/session_close.py'
              - 'scripts/lib/pr_merged.py'
              - 'scripts/test-session-close.py'
              - '.github/workflows/ci.yml'
            # The rule that a worktree is created together with its owning
            # session, and the live check that reads it. Reverting the
            # sentences or the check's fixture shapes fails here.
            worktree_ownership:
              - 'AGENTS.md'
              - 'skills/worktree-dispatch/**'
              - 'scripts/check-worktree-ownership.sh'
              - 'scripts/test-check-worktree-ownership.sh'
              - '.github/workflows/ci.yml'
            npm:
              - 'npm/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
            # The shared-target queue: status reads cargo lock holders and
            # waiters, clone copies the warm target copy-on-write instead of
            # waiting on them. Hermetic (a fixture tree + python3 flock
            # holders); no cargo and no network. Not a rule lint.
            vendor_build:
              - 'scripts/vendor-build.sh'
              - 'scripts/lib/vendor_build.py'
              - 'scripts/test-vendor-build.sh'
              - '.github/workflows/ci.yml'
            grok:
              - 'third_party/grok-build/**'
              - 'patches/grok-build/**'
              - 'scripts/apply-grok-build-patches.sh'
              - 'scripts/build-grok-pager.sh'
              - 'scripts/test-grok-vendor-offline.sh'
              - 'docs/architecture/GROK_VENDOR.md'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Parallel jobs (only when paths match)
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
      # PRs restore the default-branch cache and do not save. A per-PR copy
      # is immutable for the life of that key and, for the vendored workspace,
      # about 2 GB — enough to evict the release cache. Reruns rebuild the
      # delta from main.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-clippy-v2
          cache-workspace-crates: true
          cache-on-failure: ${{ github.ref == 'refs/heads/main' }}
          cache-provider: github
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -W clippy::all

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v2
          cache-workspace-crates: true
          cache-on-failure: ${{ github.ref == 'refs/heads/main' }}
          cache-provider: github
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  semver:
    name: semver
    needs: changes
    if: needs.changes.outputs.semver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
      - run: ./scripts/check-semver.sh
      - run: node npm/scripts/check-version-match.js

  # The publish → verify race guard. Hermetic (a local mock registry, no
  # network, no credentials), so it is cheap: it reproduces the shape of the
  # v5.7.0 failure — a version that is not readable yet and becomes readable
  # later — and fails if the retry window or the shared helper is undone.
  release_verify:
    name: release verify retry
    needs: changes
    if: needs.changes.outputs.release_verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
      - run: ./scripts/test-npm-verify-retry.sh

  # The CHANGELOG release move. Hermetic (fixture CHANGELOGs in a temp dir, no
  # network, no repo writes), so it is cheap: it pins that a bump takes the
  # Unreleased items into the new version section verbatim, which is the
  # v5.7.0 defect — seven shipped items left filed as unreleased, one --desc
  # line in their place.
  changelog:
    name: changelog move
    needs: changes
    if: needs.changes.outputs.changelog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/reorder-changelog.sh --check
      - run: ./scripts/test-changelog-release.sh

  # Hermetic. Fails if the unit's finish line leaves the 160-character
  # description window, or if a brief that bans the release lane while the
  # user asked for a version starts to pass.
  session_close:
    name: session close
    needs: changes
    if: needs.changes.outputs.session_close == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 ./scripts/test-session-close.py

  # The shared vendored-target queue. Hermetic: a fixture target tree plus
  # python3 flock holders (one with a fake rustc child), so it pins the
  # holder/waiter contract, the clone fail-close, the copy retry and prune
  # without cargo, network, or ~/.cache writes.
  vendor_build:
    name: vendor build queue
    needs: changes
    if: needs.changes.outputs.vendor_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install lsof
        run: |
          if ! command -v lsof >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lsof
          fi
      - run: ./scripts/test-vendor-build.sh

  # Hermetic. The rule that create and the owning session are one action, and
  # the live check that reads it: fixture worktrees over a throwaway git repo
  # and a stub `orca` — no daemon, no network, no writes outside a temp dir.
  worktree_ownership:
    name: worktree ownership
    needs: changes
    if: needs.changes.outputs.worktree_ownership == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-check-worktree-ownership.sh

  # The npm wrapper is the install path users actually run. The tests are
  # hermetic (stub binaries, temp dirs) and finish in seconds.
  npm:
    name: npm
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --test npm/test/*.js

  # Vendored Grok validation on pull requests: format and strict Clippy.
  # The workspace test is CI grok test, a separate workflow, so a later
  # main push does not cancel it.
  grok_fmt:
    name: grok fmt
    needs: changes
    if: needs.changes.outputs.grok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: third_party/grok-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  grok_clippy:
    name: grok clippy
    needs: changes
    if: needs.changes.outputs.grok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: third_party/grok-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
      - name: Install protobuf compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
      - name: Cache Grok Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-build-clippy-v2
          workspaces: third_party/grok-build -> target
          cache-workspace-crates: true
          cache-on-failure: ${{ github.ref == 'refs/heads/main' }}
          cache-provider: github
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Libs and bins only. `--all-targets` also lints tests, benches, and
      # examples. rust-cache does not keep those kinds, so that work is redone
      # on every run. Library and binary code stays under `-D warnings`.
      - run: cargo clippy --workspace -- -D warnings

  # ---------------------------------------------------------------------------
  # Always-on merge gate (branch protection / rulesets should require THIS name)
  # Context shown in GitHub UI: "CI / required"
  # ---------------------------------------------------------------------------
  required:
    name: required
    needs: [changes, fmt, clippy, test, semver, release_verify, changelog, session_close, vendor_build, worktree_ownership, npm, grok_fmt, grok_clippy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate CI results
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }}"
          echo "fmt=${{ needs.fmt.result }}"
          echo "clippy=${{ needs.clippy.result }}"
          echo "test=${{ needs.test.result }}"
          echo "semver=${{ needs.semver.result }}"
          echo "release_verify=${{ needs.release_verify.result }}"
          echo "changelog=${{ needs.changelog.result }}"
          echo "session_close=${{ needs.session_close.result }}"
          echo "vendor_build=${{ needs.vendor_build.result }}"
          echo "worktree_ownership=${{ needs.worktree_ownership.result }}"
          echo "npm=${{ needs.npm.result }}"
          echo "grok_fmt=${{ needs.grok_fmt.result }}"
          echo "grok_clippy=${{ needs.grok_clippy.result }}"

          fail=0
          # path detect must succeed
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::changes (path detect) failed"
            fail=1
          fi

          # For each optional job: success OR skipped is OK; failure/cancelled is not
          for pair in \
            "fmt:${{ needs.fmt.result }}" \
            "clippy:${{ needs.clippy.result }}" \
            "test:${{ needs.test.result }}" \
            "semver:${{ needs.semver.result }}" \
            "release_verify:${{ needs.release_verify.result }}" \
            "changelog:${{ needs.changelog.result }}" \
            "session_close:${{ needs.session_close.result }}" \
            "vendor_build:${{ needs.vendor_build.result }}" \
            "worktree_ownership:${{ needs.worktree_ownership.result }}" \
            "npm:${{ needs.npm.result }}" \
            "grok_fmt:${{ needs.grok_fmt.result }}" \
            "grok_clippy:${{ needs.grok_clippy.result }}"
          do
            name="${pair%%:*}"
            result="${pair##*:}"
            case "$result" in
              success|skipped) echo "ok $name=$result" ;;
              *)
                echo "::error::$name ended with $result"
                fail=1
                ;;
            esac
          done

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "CI required check green"
