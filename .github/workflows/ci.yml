name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-hygiene:
    name: docs-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required paths exist
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            NOTICE
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            AGENTS.md
            docs/README.md
            docs/product/VISION.md
            docs/product/SOURCES.md
            docs/product/NON_GOALS.md
            docs/product/PRD-v1.md
            docs/product/MILESTONES.md
            docs/architecture/REPO_LAYOUT.md
            docs/specs/00-overview.md
            docs/contributing/pull-requests.md
            docs/contributing/commits.md
            docs/contributing/branches.md
            .github/labels.json
            .github/PULL_REQUEST_TEMPLATE.md
          )
          for p in "${required[@]}"; do
            test -e "$p" || { echo "missing: $p"; exit 1; }
          done
          echo "ok: required paths present"

      - name: Labels JSON is valid
        run: |
          python3 - <<'PY'
          import json
          json.load(open(".github/labels.json"))
          print("ok labels.json")
          PY

      - name: No accidental secrets patterns in tracked files
        run: |
          set -euo pipefail
          if git grep -nE 'sk-[a-zA-Z0-9]{20,}' -- . \
            ':(exclude)*.md' ':(exclude).github/**' 2>/dev/null; then
            echo "possible API key material in non-doc files" >&2
            exit 1
          fi
          echo "ok no obvious key patterns in code paths"

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # type(scope)!: summary  — aligned with docs/contributing/pull-requests.md
          pattern='^(feat|fix|docs|spec|chore|refactor|test|ci|perf|build)(\([a-z0-9][a-z0-9/_-]*\))?\!?: .+'
          echo "title: ${TITLE}"
          if ! printf '%s\n' "${TITLE}" | grep -Eq "${pattern}"; then
            echo "::error::PR title must be Conventional Commits, e.g. 'docs(contributing): add PR guide'"
            echo "allowed types: feat fix docs spec chore refactor test ci perf build"
            exit 1
          fi
          # discourage trailing period / empty summary after colon
          if printf '%s\n' "${TITLE}" | grep -Eq '\.$'; then
            echo "::error::PR title should not end with a period"
            exit 1
          fi
          echo "ok: conventional PR title"

  pr-kind-label:
    name: pr-kind-label
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one kind label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels="$(gh api "repos/${REPO}/pulls/${PR}" --jq '[.labels[].name] | join(",")')"
          echo "labels: ${labels:-<none>}"
          kinds='feat|fix|docs|spec|chore|refactor|test|ci'
          count="$(printf '%s\n' "${labels}" | tr ',' '\n' | grep -Ecx "${kinds}" | wc -l | tr -d ' ')"
          # grep -c returns 1 line with count when using -c on multiple? Using loop instead
          count=0
          IFS=',' read -r -a arr <<< "${labels}"
          for l in "${arr[@]}"; do
            case "${l}" in
              feat|fix|docs|spec|chore|refactor|test|ci) count=$((count + 1)) ;;
            esac
          done
          if [[ "${count}" -ne 1 ]]; then
            echo "::error::Ready PRs need exactly one kind label (feat|fix|docs|spec|chore|refactor|test|ci). found=${count}"
            exit 1
          fi
          echo "ok: kind label count=${count}"
