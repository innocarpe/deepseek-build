# CI — parallel path-aware jobs + always-green required check.
# Not process-police. Not one serial mega-job.
#
# Why one workflow with many jobs (not only separate YAML files)?
# GitHub treats *skipped* required checks as failures. Separate path-filtered
# workflows never report when docs-only → branch protection blocks merges.
# A single always-on `required` job aggregates parallel work and stays required.
#
# UI: "CI / fmt", "CI / test", "CI / grok fmt",
# "CI / grok clippy", "CI / grok test", "CI / required".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — cheap always-on detector
  # ---------------------------------------------------------------------------
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      semver: ${{ steps.filter.outputs.semver }}
      grok: ${{ steps.filter.outputs.grok }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.github/workflows/ci.yml'
            semver:
              - 'Cargo.toml'
              - 'package.json'
              - 'scripts/check-semver.sh'
              - 'npm/scripts/check-version-match.js'
              - '.github/workflows/ci.yml'
            grok:
              - 'third_party/grok-build/**'
              - 'patches/grok-build/**'
              - 'scripts/apply-grok-build-patches.sh'
              - 'scripts/build-grok-pager.sh'
              - 'scripts/test-grok-vendor-offline.sh'
              - 'docs/architecture/GROK_VENDOR.md'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Parallel jobs (only when paths match)
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
      - name: Restore base Rust cache
        if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-clippy-v2
          cache-workspace-crates: true
          cache-provider: github
          save-if: false
      - name: Cache PR/main Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event_name == 'pull_request' && format('workspace-clippy-v2-pr-{0}', github.event.pull_request.number) || 'workspace-clippy-v2' }}
          cache-workspace-crates: true
          cache-on-failure: true
          cache-provider: github
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -W clippy::all

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Restore base Rust cache
        if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test-v2
          cache-workspace-crates: true
          cache-provider: github
          save-if: false
      - name: Cache PR/main Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event_name == 'pull_request' && format('workspace-test-v2-pr-{0}', github.event.pull_request.number) || 'workspace-test-v2' }}
          cache-workspace-crates: true
          cache-on-failure: true
          cache-provider: github
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  semver:
    name: semver
    needs: changes
    if: needs.changes.outputs.semver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
      - run: ./scripts/check-semver.sh
      - run: node npm/scripts/check-version-match.js

  # Vendored Grok validation. PRs keep the fast format and strict Clippy gates.
  # The full upstream workspace test runs once after merge instead of once per
  # stacked PR; the required aggregator accepts that job as skipped on PRs.
  grok_fmt:
    name: grok fmt
    needs: changes
    if: needs.changes.outputs.grok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: third_party/grok-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  grok_clippy:
    name: grok clippy
    needs: changes
    if: needs.changes.outputs.grok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: third_party/grok-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
      - name: Install protobuf compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
      - name: Restore base Grok Rust cache
        if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-build-clippy-v2
          workspaces: third_party/grok-build -> target
          cache-workspace-crates: true
          cache-provider: github
          save-if: false
      - name: Cache PR/main Grok Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event_name == 'pull_request' && format('grok-build-clippy-v2-pr-{0}', github.event.pull_request.number) || 'grok-build-clippy-v2' }}
          workspaces: third_party/grok-build -> target
          cache-workspace-crates: true
          cache-on-failure: true
          cache-provider: github
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --workspace -- -D warnings

  grok_test:
    name: grok test
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.grok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # SessionActor turn futures can exceed Rust's 2 MiB default test-thread stack.
      RUST_MIN_STACK: "16777216"
    defaults:
      run:
        working-directory: third_party/grok-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - name: Install protobuf compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
      - name: Install ripgrep (grep tool tests shell out to `rg`)
        run: |
          sudo apt-get install -y -qq ripgrep
          echo "rg: $(command -v rg) $(rg --version | head -n 1)"
      - name: Restore base Grok Rust cache
        if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: grok-build-test-v2
          workspaces: third_party/grok-build -> target
          cache-workspace-crates: true
          cache-provider: github
          save-if: false
      - name: Cache PR/main Grok Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.event_name == 'pull_request' && format('grok-build-test-v2-pr-{0}', github.event.pull_request.number) || 'grok-build-test-v2' }}
          workspaces: third_party/grok-build -> target
          cache-workspace-crates: true
          cache-on-failure: true
          cache-provider: github
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Always-on merge gate (branch protection / rulesets should require THIS name)
  # Context shown in GitHub UI: "CI / required"
  # ---------------------------------------------------------------------------
  required:
    name: required
    needs: [changes, fmt, clippy, test, semver, grok_fmt, grok_clippy, grok_test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate CI results
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }}"
          echo "fmt=${{ needs.fmt.result }}"
          echo "clippy=${{ needs.clippy.result }}"
          echo "test=${{ needs.test.result }}"
          echo "semver=${{ needs.semver.result }}"
          echo "grok_fmt=${{ needs.grok_fmt.result }}"
          echo "grok_clippy=${{ needs.grok_clippy.result }}"
          echo "grok_test=${{ needs.grok_test.result }}"

          fail=0
          # path detect must succeed
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::changes (path detect) failed"
            fail=1
          fi

          # For each optional job: success OR skipped is OK; failure/cancelled is not
          for pair in \
            "fmt:${{ needs.fmt.result }}" \
            "clippy:${{ needs.clippy.result }}" \
            "test:${{ needs.test.result }}" \
            "semver:${{ needs.semver.result }}" \
            "grok_fmt:${{ needs.grok_fmt.result }}" \
            "grok_clippy:${{ needs.grok_clippy.result }}" \
            "grok_test:${{ needs.grok_test.result }}"
          do
            name="${pair%%:*}"
            result="${pair##*:}"
            case "$result" in
              success|skipped) echo "ok $name=$result" ;;
              *)
                echo "::error::$name ended with $result"
                fail=1
                ;;
            esac
          done

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "CI required check green"
