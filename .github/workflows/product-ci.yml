# Product CI — parallel path-aware jobs + always-green merge gate.
# Not process-police. Not one serial mega-job.
#
# Why one workflow with many jobs (not only separate YAML files)?
# GitHub treats *skipped* required checks as failures. Separate path-filtered
# workflows never report when docs-only → branch protection blocks merges.
# A single always-on `gate` job aggregates parallel work and stays required.

name: product-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — cheap always-on detector
  # ---------------------------------------------------------------------------
  changes:
    name: detect-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      smoke: ${{ steps.filter.outputs.smoke }}
      semver: ${{ steps.filter.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.github/workflows/product-ci.yml'
            smoke:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'npm/**'
              - 'scripts/smoke-dogfood.sh'
              - 'scripts/check-semver.sh'
              - 'scripts/install.sh'
              - '.github/workflows/product-ci.yml'
            semver:
              - 'Cargo.toml'
              - 'package.json'
              - 'scripts/check-semver.sh'
              - 'npm/scripts/check-version-match.js'
              - '.github/workflows/product-ci.yml'

  # ---------------------------------------------------------------------------
  # Parallel product jobs (only when paths match)
  # ---------------------------------------------------------------------------
  fmt:
    name: cargo-fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-v1
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo-clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-v1
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -W clippy::all

  test:
    name: cargo-test-workspace
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-v1
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  smoke:
    name: offline-smoke
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-v1
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
      - run: ./scripts/smoke-dogfood.sh
        env:
          DEEPSEEK_API_KEY: ""

  semver:
    name: cargo-npm-version
    needs: changes
    if: needs.changes.outputs.semver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
      - run: ./scripts/check-semver.sh
      - run: node npm/scripts/check-version-match.js

  # ---------------------------------------------------------------------------
  # Always-on merge gate (branch protection / rulesets should require THIS name)
  # Context shown in GitHub UI: "product-ci / gate"
  # ---------------------------------------------------------------------------
  gate:
    name: gate
    needs: [changes, fmt, clippy, test, smoke, semver]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate product CI
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }}"
          echo "fmt=${{ needs.fmt.result }}"
          echo "clippy=${{ needs.clippy.result }}"
          echo "test=${{ needs.test.result }}"
          echo "smoke=${{ needs.smoke.result }}"
          echo "semver=${{ needs.semver.result }}"

          fail=0
          # detect-paths must succeed
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::path detect failed"
            fail=1
          fi

          # For each optional job: success OR skipped is OK; failure/cancelled is not
          for pair in \
            "fmt:${{ needs.fmt.result }}" \
            "clippy:${{ needs.clippy.result }}" \
            "test:${{ needs.test.result }}" \
            "smoke:${{ needs.smoke.result }}" \
            "semver:${{ needs.semver.result }}"
          do
            name="${pair%%:*}"
            result="${pair##*:}"
            case "$result" in
              success|skipped) echo "ok $name=$result" ;;
              *)
                echo "::error::$name ended with $result"
                fail=1
                ;;
            esac
          done

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "product-ci gate green"
