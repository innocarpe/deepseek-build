# Build and attach the Apple Silicon macOS prebuilt on version tags (ADR 0009).
# publish-npm.yml publishes after the asset is attached.
#
# The agent is always rebuilt. Reusing the previous tag's binary shipped a
# version string that failed the npm postinstall check.
#
# Cache: restore the default-branch Rust cache (seed-release-cache.yml writes
# it after this workflow). Do not save here. A cache saved on a tag ref is
# invisible to the next tag. This job uploads an archive the seed workflow
# re-saves on the default branch. A missing or oversized archive does not
# fail the release.
name: release-prebuilt

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version whose release asset should be built"
        required: true
        type: string

permissions:
  contents: write
  actions: write

env:
  # CARGO_* and RUST* are part of the Swatinem cache key. seed-release-cache.yml
  # must set the same values or the next tag will not restore this build.
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + tags so prev SemVer tag and third_party
          # diffs resolve. Shallow checkouts made prev_tag empty and forced
          # a full agent rebuild on every release.
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all version tags
        run: |
          # checkout v4 sometimes only materializes the push ref; make sure
          # we can list vX.Y.Z tags for the wrapper fast path.
          git fetch --force --tags origin || true
          echo "tags (newest 8):"
          git tag -l 'v[0-9]*' --sort=-v:refname | head -n 8 || true

      - name: Resolve release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          [[ "$PACKAGE_VERSION" == "$VERSION" ]] || {
            echo "package version $PACKAGE_VERSION does not match release $VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=v$VERSION platform=${{ matrix.platform }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      # Restore only. The save lands on this tag ref, which the next tag
      # cannot read. seed-release-cache.yml saves the archive on main.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            third_party/grok-build
          shared-key: release-prebuilt-${{ matrix.platform }}
          cache-all-crates: true
          cache-provider: github
          save-if: false

      - name: Install protoc
        run: |
          brew install protobuf || true

      - name: Detect change scope
        id: scope
        run: |
          set -euo pipefail

          CURRENT_TAG="${GITHUB_REF_NAME:-}"

          # Every release ships an agent labeled with THIS version (the npm
          # postinstall self-check requires `agent --version` to contain the
          # package version). The agent is therefore always rebuilt; reusing
          # the previous release's binary (the old "wrapper" fast path)
          # shipped version-mismatched agents and silently broke installs.
          SCOPE="full"
          echo "always full: agent must be rebuilt for the release version"

          {
            echo "scope=${SCOPE}"
          } >> "$GITHUB_OUTPUT"
          echo "scope=${SCOPE} current=${CURRENT_TAG:-none}"

      - name: Build wrappers
        run: |
          cargo install --path crates/dsb-cli --locked --force --root "$HOME/.deepseek-build"

      - name: Install dotslash (vendored protoc launcher)
        run: |
          if ! command -v dotslash >/dev/null 2>&1; then
            cargo install dotslash
          fi

      - name: Build agent
        run: |
          ./scripts/build-grok-pager.sh release
          AGENT=""
          for cand in \
            third_party/grok-build/target/release/xai-grok-pager-bin \
            third_party/grok-build/target/release/xai-grok-pager
          do
            if [[ -x "$cand" ]]; then
              AGENT="$cand"
              break
            fi
          done
          test -n "$AGENT"
          cp -f "$AGENT" "$HOME/.deepseek-build/bin/deepseek-build-agent"
          chmod 755 "$HOME/.deepseek-build/bin/deepseek-build-agent"

      - name: Verify agent binary version
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          AGENT="$HOME/.deepseek-build/bin/deepseek-build-agent"
          OUT="$(env -u DEEPSEEK_BUILD_VERSION -u GROK_TEST_VERSION "$AGENT" --version 2>&1)"
          echo "agent --version: $OUT"
          BIN_VER="$(printf '%s\n' "$OUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          if [[ -z "$BIN_VER" || "$BIN_VER" != "$VERSION" ]]; then
            echo "::error::agent --version '${OUT}' does not report release version ${VERSION} (got ${BIN_VER:-none})" >&2
            exit 1
          fi
          echo "agent version matches release ${VERSION}"

      - name: Package tarball
        run: |
          ./scripts/package-release-binaries.sh --platform "${{ matrix.platform }}"

      - name: Verify packaged tarball version
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          ASSET="dist/deepseek-build-${VERSION}-${{ matrix.platform }}.tar.gz"
          TMP="$(mktemp -d)"
          tar -xzf "$ASSET" -C "$TMP"
          OUT="$(env -u DEEPSEEK_BUILD_VERSION -u GROK_TEST_VERSION "$TMP/deepseek-build-agent" --version 2>&1)"
          echo "packaged agent --version: $OUT"
          BIN_VER="$(printf '%s\n' "$OUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          if [[ -z "$BIN_VER" || "$BIN_VER" != "$VERSION" ]]; then
            echo "::error::packaged agent --version '${OUT}' does not report release version ${VERSION} (got ${BIN_VER:-none})" >&2
            exit 1
          fi
          echo "packaged agent version matches release ${VERSION}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          ASSET="dist/deepseek-build-${VERSION}-${{ matrix.platform }}.tar.gz"
          # Release may already exist (created by first matrix job / maintainer)
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes || true
          fi
          gh release upload "v${VERSION}" "$ASSET" --clobber

      # After the asset upload so publish-npm can proceed while this packs.
      # continue-on-error: a cache miss next time is better than a failed release.
      - name: Pack Rust cache for the default branch
        id: pack
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          ./scripts/release-rust-cache.sh pack "$RUNNER_TEMP/release-rust-cache.tar.gz"

      - name: Upload Rust cache archive
        if: steps.pack.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-rust-cache-darwin-arm64
          path: ${{ runner.temp }}/release-rust-cache.tar.gz
          retention-days: 2
          if-no-files-found: ignore
