# Build and attach the Apple Silicon macOS prebuilt on version tags (ADR 0009).
# Maintainer still runs npm publish (OTP) after assets exist.
#
# Change-scope fast path (docs/contributing/release-cycle.md):
#   - third_party/ unchanged since the previous release tag -> reuse that
#     release's vendored agent binary, rebuild only the dsb-cli wrappers
#     (seconds instead of a full vendored build).
#   - third_party/ changed -> full vendored build; sccache makes it
#     incremental across runs (SCCACHE_GHA_CACHE).
# If the previous Apple Silicon tarball is missing, we fall back to full.
name: release-prebuilt

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version whose release asset should be built"
        required: true
        type: string

permissions:
  contents: write

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_CACHE: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          [[ "$PACKAGE_VERSION" == "$VERSION" ]] || {
            echo "package version $PACKAGE_VERSION does not match release $VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=v$VERSION platform=${{ matrix.platform }}"
      - uses: mozilla-actions/sccache-action@v0.0.6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Install protoc
        run: |
          brew install protobuf || true
      - name: Detect change scope
        id: scope
        run: |
          PREV_TAG="$(git tag --merged HEAD --sort=-v:refname | awk '!seen[$0]++' | sed -n '2p' || true)"
          SCOPE="full"
          if [[ -n "$PREV_TAG" ]] && git diff --quiet "$PREV_TAG" HEAD -- third_party/; then
            SCOPE="wrapper"
          fi
          echo "prev_tag=${PREV_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"
          echo "scope=${SCOPE} prev_tag=${PREV_TAG:-none}"
      - name: Fetch previous release binaries (reuse agent when vendored tree unchanged)
        id: prev
        if: steps.scope.outputs.scope != 'full'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/prev "$HOME/.deepseek-build/bin"
          if ! gh release download "${{ steps.scope.outputs.prev_tag }}" \
                --pattern "deepseek-build-*-${{ matrix.platform }}.tar.gz" \
                --dir /tmp/prev --clobber; then
            echo "prev tarball missing for ${{ steps.scope.outputs.prev_tag }}/${{ matrix.platform }}; falling back to full build"
            echo "scope=full" >> "$GITHUB_OUTPUT"
          else
            tar -xzf /tmp/prev/*.tar.gz -C "$HOME/.deepseek-build/bin"
            echo "reused agent from ${{ steps.scope.outputs.prev_tag }} (${{ matrix.platform }})"
          fi
      - name: Build wrappers
        run: |
          cargo install --path crates/dsb-cli --locked --force --root "$HOME/.deepseek-build"
      - name: Install dotslash (vendored protoc launcher)
        if: steps.scope.outputs.scope == 'full' || steps.prev.outputs.scope == 'full'
        run: |
          if ! command -v dotslash >/dev/null 2>&1; then
            cargo install dotslash
          fi
      - name: Build agent
        if: steps.scope.outputs.scope == 'full' || steps.prev.outputs.scope == 'full'
        run: |
          ./scripts/build-grok-pager.sh release
          AGENT="$(ls third_party/grok-build/target/release/xai-grok-pager-bin third_party/grok-build/target/release/xai-grok-pager 2>/dev/null | head -1)"
          test -n "$AGENT"
          cp -f "$AGENT" "$HOME/.deepseek-build/bin/deepseek-build-agent"
          chmod 755 "$HOME/.deepseek-build/bin/deepseek-build-agent"
      - name: Package tarball
        run: |
          ./scripts/package-release-binaries.sh --platform "${{ matrix.platform }}"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          ASSET="dist/deepseek-build-${VERSION}-${{ matrix.platform }}.tar.gz"
          # Release may already exist (created by first matrix job / maintainer)
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes || true
          fi
          gh release upload "v${VERSION}" "$ASSET" --clobber
