# Re-save a release build's Rust artifacts on the default branch.
#
# release-prebuilt.yml runs on a tag. Actions cache saved there is invisible
# to the next tag; a tag run can restore caches from the default branch.
# This workflow runs in the default-branch context (workflow_run), unpacks
# the archive the tag build uploaded, and lets rust-cache save it here.
#
# An exact key match is left alone (Actions caches are immutable). A miss
# or a lockfile-prefix match saves what the tag just built. Package versions
# are not part of the Swatinem key, so a pure version bump restores this
# entry and recompiles only the crates whose build script saw the new version.
name: seed-release-cache

on:
  workflow_run:
    workflows: ["release-prebuilt"]
    types: [completed]
  # The v6.1.0 tag ran the old workflow and uploaded no archive, so the
  # workflow_run seed had nothing to save. Dispatch builds that archive's
  # contents on main and checks the next job can restore them.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: seed-release-cache
  cancel-in-progress: false

jobs:
  seed:
    name: seed default-branch cache
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # Must match release-prebuilt.yml. RUST* and CARGO* are part of the
      # rust-cache key; a mismatch saves an entry the next tag will not restore.
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Download the release Rust archive
        id: archive
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-rust-cache-darwin-arm64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-rust-cache

      # lookup-only so a prefix hit does not extract an older cache. On a
      # prefix hit the action clears target/ in this step, which is still
      # empty; the unpack below runs after that and before the post save.
      # No archive: skip the action entirely. Its post step would otherwise
      # save an empty target and freeze that key.
      - name: Open the release cache key
        id: cache
        if: steps.archive.outcome == 'success'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            third_party/grok-build
          shared-key: release-prebuilt-darwin-arm64
          cache-all-crates: true
          # The 41-minute cost is the vendored workspace crates, not crates.io.
          # The default leaves those rlibs out of the saved cache, so the next
          # tag still compiles them. Keep them.
          cache-workspace-crates: true
          cache-provider: github
          lookup-only: true
          save-if: true

      - name: Unpack into the cache paths
        if: steps.archive.outcome == 'success'
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/release-rust-cache" -name 'release-rust-cache.tar.gz' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "::error::artifact had no release-rust-cache.tar.gz" >&2
            exit 1
          fi
          ./scripts/release-rust-cache.sh unpack "$archive"

  warm:
    name: build the first release cache
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Install protoc
        run: brew install protobuf || true

      - name: Install dotslash (vendored protoc launcher)
        run: |
          if ! command -v dotslash >/dev/null 2>&1; then
            cargo install dotslash
          fi

      - name: Open the release cache key
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            third_party/grok-build
          shared-key: release-prebuilt-darwin-arm64
          cache-all-crates: true
          cache-workspace-crates: true
          cache-provider: github
          save-if: true

      - name: Build the release agent
        run: ./scripts/build-grok-pager.sh release

  verify:
    name: restore the release cache
    needs: warm
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Install protoc
        run: brew install protobuf || true

      - name: Install dotslash (vendored protoc launcher)
        run: |
          if ! command -v dotslash >/dev/null 2>&1; then
            cargo install dotslash
          fi

      - name: Restore the release cache
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            third_party/grok-build
          shared-key: release-prebuilt-darwin-arm64
          cache-all-crates: true
          cache-workspace-crates: true
          cache-provider: github
          save-if: false

      - name: Require a cache hit
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [[ "${{ steps.cache.outputs.cache-hit }}" != "true" ]]; then
            echo "::error::release cache was not restored" >&2
            exit 1
          fi

      - name: Rebuild and count crates that were not cached
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/rebuild.log"
          ./scripts/build-grok-pager.sh release 2>&1 | tee "$log"
          compiling="$(grep -c '^   Compiling ' "$log" || true)"
          echo "compiling=$compiling"
          # A cold vendored build compiles well over a thousand crates.
          # The version-stamped crates may rebuild; the rest must be cached.
          if [[ "$compiling" -gt 40 ]]; then
            echo "::error::restored cache still compiled ${compiling} crates" >&2
            exit 1
          fi
