# Offline dual-CLI / SemVer smoke. Heavier than unit tests — path-gated.
# Does NOT need: fmt/clippy. Runs in parallel with rust-test when both match.
name: smoke-dogfood

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "npm/**"
      - "scripts/smoke-dogfood.sh"
      - "scripts/check-semver.sh"
      - "scripts/install.sh"
      - ".github/workflows/smoke-dogfood.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "npm/**"
      - "scripts/smoke-dogfood.sh"
      - "scripts/check-semver.sh"
      - "scripts/install.sh"
      - ".github/workflows/smoke-dogfood.yml"

concurrency:
  group: smoke-dogfood-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DEEPSEEK_API_KEY: ""

jobs:
  smoke:
    name: offline-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-v1
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi

      - name: Offline dogfood smoke
        run: ./scripts/smoke-dogfood.sh
