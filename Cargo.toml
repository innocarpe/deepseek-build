[workspace]
resolver = "2"
members = [
    "crates/dsb-agent",
    "crates/dsb-cli",
    "crates/dsb-config",
    "crates/dsb-context",
    "crates/dsb-provider-deepseek",
]
# Prefer `cargo test --workspace` in CI/docs so library crates always run.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/innocarpe/deepseek-build"
authors = ["DeepSeek Build contributors"]
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
