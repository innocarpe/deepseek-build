[workspace]
resolver = "2"
members = [
    "crates/dsb-cli",
]
default-members = ["crates/dsb-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/innocarpe/deepseek-build"
authors = ["DeepSeek Build contributors"]
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
