[package]
name = "dsb-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Tool runtime: snippets (spec 45) and permissions (spec 90 min)"
publish = false

[dependencies]
dsb-provider-deepseek = { path = "../dsb-provider-deepseek" }
dsb-context = { path = "../dsb-context" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ulid = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
